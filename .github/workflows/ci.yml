name: molecule test

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "defaults/**"
      - "handlers/**"
      - "molecule/**"
      - "tasks/**"
      - "templates/**"
      - "vars/**"
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

jobs:
  standalone:
    name: Single node setup
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: arc-runner-public-docker
    strategy:
      fail-fast: false
      matrix:
        config:
          - image: "rockylinux9"
            cgroup_mode: "host"
            volumes: "rw"
          - image: "ubuntu2404"
            cgroup_mode: "host"
            volumes: "rw"
          - image: "ubuntu2404"
            cgroup_mode: "private"
            volumes: "rw"
          - image: "rockylinux9"
            cgroup_mode: "private"
            volumes: "rw"
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          path: "lablabs.rke2"

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip3 install ansible docker molecule molecule-plugins[docker] netaddr "requests<2.29.2"

      - name: Run Molecule tests
        run: molecule test --destroy never
        working-directory: ./lablabs.rke2
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_IMAGE: ${{ matrix.config.image }}
          MOLECULE_DOCKER_CGROUPS_MODE: ${{ matrix.config.cgroup_mode }}
          MOLECULE_DOCKER_VOLUMES: ${{ matrix.config.volumes }}

      - name: Debug rke2 service on failure
        if: failure()
        run: |
          docker ps -a
          for n in $(docker ps -q); do
            docker exec "$n" systemctl status rke2-server --no-pager || true
            docker exec "$n" journalctl -u rke2-server --no-pager -n 150 || true
            docker exec "$n" sh -c 'tail -n 60 /var/lib/rancher/rke2/agent/containerd/containerd.log /var/lib/rancher/rke2/agent/logs/kubelet.log 2>&1' || true
          done
          docker info | head -40

  cluster:
    name: Cluster setup
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: arc-runner-public-docker
    needs: standalone
    strategy:
      matrix:
        config:
          - image: "ubuntu2404"
            cgroup_mode: "host"
            volumes: "rw"
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          path: "lablabs.rke2"

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip3 install ansible docker molecule molecule-plugins[docker] netaddr "requests<2.29.2"

      - name: Run Molecule tests
        run: molecule test --scenario-name cluster
        working-directory: ./lablabs.rke2
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_IMAGE: ${{ matrix.config.image }}
          MOLECULE_TAG: ${{ matrix.config.tag }}
          MOLECULE_DOCKER_CGROUPS_MODE: ${{ matrix.config.cgroup_mode }}

